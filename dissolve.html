<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thought Dissolver</title>
    <style>
        /* CSS - The "Look and Feel" */
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .controls {
            position: absolute;
            top: 40px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        #thought-input {
            width: 60%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 15px 25px;
            color: white;
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #thought-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .config {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        #speed-slider {
            vertical-align: middle;
            margin: 0 10px;
            cursor: pointer;
        }

        #canvas {
            width: 90vw;
            max-width: 900px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: center;
            gap: 12px;
            padding: 20px;
        }

        .word {
            display: inline-block;
            font-size: 2.5rem;
            font-weight: 300;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            transform: scale(1);
        }

        .dissolving {
            opacity: 0;
            filter: blur(12px);
            transform: scale(1.2) translateY(-10px);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="thought-input" placeholder="Type a thought and press Enter..." autocomplete="off">
        <div class="config">
            INTERVAL: <span id="speed-display">0.5</span>s
            <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.1" value="0.5">
        </div>
    </div>

    <div id="canvas">
        </div>

    <script>
        /* JavaScript - The "Brain" */
        const input = document.getElementById('thought-input');
        const canvas = document.getElementById('canvas');
        const slider = document.getElementById('speed-slider');
        const speedDisplay = document.getElementById('speed-display');

        let activeTimer = null;

        // Update the display label when slider moves
        slider.addEventListener('input', () => {
            speedDisplay.textContent = slider.value;
        });

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && input.value.trim() !== '') {
                startDissolve(input.value);
                input.value = ''; // Reset input for the next thought
            }
        });

        function startDissolve(text) {
            // Stop any current dissolution process
            clearInterval(activeTimer);
            canvas.innerHTML = '';

            // 1. Split text and create individual elements
            const words = text.split(/\s+/);
            words.forEach(word => {
                const span = document.createElement('span');
                span.className = 'word';
                span.textContent = word;
                canvas.appendChild(span);
            });

            // 2. Begin the random removal process
            activeTimer = setInterval(() => {
                const remaining = document.querySelectorAll('.word:not(.dissolving)');
                
                if (remaining.length > 0) {
                    const target = remaining[Math.floor(Math.random() * remaining.length)];
                    target.classList.add('dissolving');
                } else {
                    clearInterval(activeTimer);
                }
            }, parseFloat(slider.value) * 1000);
        }
    </script>
</body>
</html>
